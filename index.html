<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliê Itinerâncias — Abololab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --orange:#E6552C;
    --orange-deep:#7A2A12;
    --pink:#F0A8D2;
    --pink-deep:#7A2A55;
    --lime:#C3D62E;
    --lime-deep:#48511A;
    --blue:#5279C0;
    --blue-deep:#1F3054;
    --mustard:#F0C23E;
    --mustard-deep:#6B4C0A;
    --ink:#211C18;
    --ink-soft:#6B6055;
    --paper:#FBF3E4;
    --paper-2:#FFFFFF;
    --line:#E4D4B8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{ font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper); }
  h1,h2,h3,.display{ font-family:'Baloo 2',sans-serif; }
  .hero-banner{ width:100%; display:block; }
  .hero-banner img{ width:100%; display:block; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:1.25rem 1.5rem;
    justify-content:center;
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:9px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:var(--ink);
  }
  .tab-btn:not(.active){ background:var(--paper); }
  main{ max-width:640px; margin:0 auto; padding:2rem 1.5rem 4rem; }
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:1.5rem;
    margin-bottom:1.5rem;
  }
  .swatch-band{
    height:8px;
    border-radius:8px;
    margin-bottom:1.1rem;
  }
  .intro h2{
    font-weight:800;
    font-size:27px;
    margin:0 0 .15rem;
  }
  .intro .ministrante-line{ font-size:13.5px; color:var(--ink-soft); margin:0 0 1rem; }
  .doc-text{ font-size:14.5px; line-height:1.68; margin:0 0 1rem; }
  .doc-text.welcome{ font-family:'Baloo 2',sans-serif; font-weight:600; font-size:17px; margin-bottom:1rem; }
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:1.4rem 0 .5rem;
  }
  ul.doc-list{ margin:0 0 1rem; padding-left:1.2rem; font-size:14.5px; line-height:1.68; }
  ul.doc-list li{ margin-bottom:2px; }

  .hero-badges{ display:flex; gap:10px; flex-wrap:wrap; margin:.9rem 0 1.25rem; }
  .badge-local{
    flex:1 1 190px;
    border-radius:16px;
    padding:14px 15px;
    display:flex;
    align-items:flex-start;
    gap:9px;
    background:var(--accent, var(--blue));
    color:var(--accent-on, #fff);
  }
  .badge-local.muted{ background:var(--paper); border:1.5px dashed var(--line); color:var(--ink-soft); }
  .badge-local .pin{ width:19px; height:19px; flex-shrink:0; margin-top:1px; }
  .badge-local .eyebrow-mini{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; opacity:.85; display:block; margin-bottom:2px; }
  .badge-local .place-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16.5px; line-height:1.18; display:block; }
  .badge-local .addr{ font-size:11px; opacity:.85; margin-top:4px; display:block; line-height:1.4; }
  .badge-data{
    flex:1 1 160px;
    border-radius:16px;
    padding:14px 15px;
    background:var(--ink);
    color:#fff;
  }
  .badge-data .eyebrow-mini{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; opacity:.75; display:block; margin-bottom:2px; }
  .badge-data .day-month{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:21px; line-height:1.12; display:block; }
  .badge-data .pill{
    display:inline-block; margin-top:9px; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:999px; letter-spacing:.02em;
    background:var(--accent, var(--blue)); color:var(--accent-on, #fff);
  }

  .atencao-block{
    padding:14px 16px;
    border-radius:12px;
    background:var(--accent, var(--mustard));
    color:var(--accent-on, var(--mustard-deep));
    margin:0 0 1.1rem;
  }
  .atencao-title{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    margin:0 0 .5rem;
  }
  .atencao-list{
    margin:0;
    padding-left:1.15rem;
    font-size:13px;
    line-height:1.6;
  }
  .atencao-list li{ margin-bottom:5px; }
  .atencao-list li:last-child{ margin-bottom:0; }

  .gate-card{ border-width:1.5px; }
  .gate-block{ margin-bottom:1.5rem; }
  .gate-title{ font-weight:600; font-size:14.5px; margin:0 0 .5rem; }
  .gate-check{ align-items:flex-start; margin-top:.75rem; }
  .gate-check input{ margin-top:2px; }

  .edital-details{ margin-top:.9rem; border-top:1px dashed var(--line); padding-top:.9rem; }
  .edital-details summary{
    cursor:pointer; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--accent, var(--ink-soft));
    list-style:none;
  }
  .edital-details summary::-webkit-details-marker{ display:none; }
  .edital-details summary::before{ content:'+  '; }
  .edital-details[open] summary::before{ content:'–  '; }
  .edital-details .edital-body{ margin-top:1rem; }
  .status-card h3{ font-weight:700; font-size:19px; margin:0 0 .6rem; }
  .status-card p:last-child{ margin-bottom:0; }
  fieldset{ border:none; padding:0; margin:0 0 1.5rem; }
  legend{ font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px; margin-bottom:.6rem; padding:0; }
  legend .req{ color:var(--orange); font-weight:400; }
  .help-text{ font-size:12px; color:var(--ink-soft); margin:-2px 0 8px; }
  .opt-list{ display:flex; flex-direction:column; gap:6px; }
  .opt-row{
    display:flex; align-items:center; gap:9px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; cursor:pointer; font-size:14px;
  }
  .opt-row:has(input:checked){ border-color:var(--accent, var(--blue)); background:var(--accent-tint, #EAF0FA); }
  .opt-row input{ accent-color:var(--accent, var(--blue)); width:16px; height:16px; flex-shrink:0; }
  input[type=text],input[type=email],input[type=tel],select{
    width:100%; font-family:'Inter',sans-serif; font-size:14.5px; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid var(--accent, var(--blue)); outline-offset:1px; }
  .subblock{ margin-top:10px; padding-left:14px; border-left:2px solid var(--line); }
  .field-error{ font-size:12px; color:var(--orange); margin-top:6px; display:none; }
  .field-error.show{ display:block; }
  .submit-btn{
    width:100%; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; padding:14px;
    border-radius:999px; border:none; background:var(--accent, var(--orange)); color:var(--accent-on, #fff); cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.55; cursor:default; }
  .info-final{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:1.25rem; }
  .success-card{ text-align:center; padding:2.5rem 1.5rem; }
  .success-card h3{ font-weight:700; font-size:22px; margin:.5rem 0 .5rem; }
  .success-card p{ font-size:14px; color:var(--ink-soft); line-height:1.6; }
  .success-card button{
    margin-top:1.25rem; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; padding:9px 20px;
    border-radius:999px; border:none; background:var(--ink); color:#fff; cursor:pointer;
  }
  .painel-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:1rem; flex-wrap:wrap;}
  .painel-header h2{ font-size:22px; margin:0; }
  .painel-toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1rem; }
  .painel-toolbar button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; padding:7px 13px;
    border-radius:999px; border:1.5px solid var(--line); background:var(--paper-2); cursor:pointer;
  }
  .painel-toolbar button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .stats-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:1.25rem; }
  .stat-box{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 10px; }
  .stat-box span{ display:block; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; font-family:'IBM Plex Mono',monospace; }
  .stat-box strong{ font-size:19px; font-family:'Baloo 2',sans-serif; }
  .legend-row{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin-bottom:.9rem; flex-wrap:wrap; }
  .legend-row span{ display:flex; align-items:center; gap:6px; }
  .legend-dot{ width:11px; height:11px; border-radius:3px; display:inline-block; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.03em; color:var(--ink-soft); padding:6px 8px; border-bottom:1.5px solid var(--line); white-space:nowrap;
  }
  td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.in-vaga td{ background:#EFF5D2; }
  tr.fora-vaga td{ background:#FCEADB; }
  tr.contatado td{ opacity:.55; }
  .score-badge{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; padding:3px 9px;
    border-radius:999px; background:var(--ink); color:#fff; display:inline-block;
  }
  .flag-badge{ font-size:10px; padding:2px 7px; border-radius:999px; background:var(--orange); color:#fff; display:inline-block; margin-top:4px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .mini-chip{ font-size:9.5px; padding:1px 6px; border-radius:999px; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .empty-note{ font-size:13.5px; color:var(--ink-soft); padding:1.5rem; text-align:center; }
  .lock-card{ text-align:center; padding:2.5rem 1.5rem; max-width:340px; margin:0 auto; }
  .login-field{ text-align:left; margin-top:1rem; }
  .login-field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
  .login-field input{ width:100%; }
  .password-wrap{ position:relative; display:flex; align-items:center; }
  .password-wrap input{ flex:1; padding-right:70px; }
  .pw-toggle{
    position:absolute; right:6px; font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:var(--paper); cursor:pointer;
  }
  .lock-card button#admin-login-btn{
    display:block; width:100%; margin:1.1rem 0 0; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    padding:11px 20px; border-radius:999px; border:none; background:var(--ink); color:#fff; cursor:pointer;
  }
  #content.painel-mode{ max-width:1320px; }
  .toggle-btn{
    font-family:'Inter',sans-serif; font-size:11px; padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper-2); cursor:pointer;
  }
  .section-toggle{
    width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    margin-bottom:.75rem;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(33,28,24,.55); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
  }
  .modal-box{
    background:var(--paper-2); border-radius:16px; max-width:520px; width:100%;
    max-height:85vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:1.1rem 1.3rem; border-bottom:1px solid var(--line);
  }
  .modal-header h3{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; margin:0; }
  .modal-table-wrap{ overflow:auto; padding:1rem 1.3rem 1.3rem; }
  table.detail-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.detail-table th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.03em; color:var(--ink-soft); padding:7px 10px 7px 0; border-bottom:1px solid var(--line);
    white-space:nowrap; vertical-align:top; width:42%;
  }
  table.detail-table td{ padding:7px 0; border-bottom:1px solid var(--line); word-break:break-word; }
  .detail-btn{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; padding:5px 11px;
    border-radius:999px; border:1px solid var(--line); background:var(--paper-2); cursor:pointer;
  }
  @media (max-width:480px){
    .stats-row{ grid-template-columns:1fr 1fr; }
    .card{ padding:1.15rem; }
    .hero-badges{ flex-direction:column; }
    .badge-local, .badge-data{ flex-basis:auto; }
    main{ padding:1.5rem 1rem 3rem; }
    .tabs{ padding:1rem; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="hero-banner" id="hero-banner"></div>
  <p class="sr-only">Abololab apresenta: Ateliê Itinerâncias — Morro do Papagaio, Barreiro e Santa Luzia. Um circuito de oficinas gratuitas espera por você em setembro! Encadernação, Bordado, Colagem e Zines.</p>
  <nav class="tabs" id="tabs"></nav>
  <main id="content"></main>
</div>
<div id="modal-root"></div>

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = OFICINAS.map(o=>`
    <button class="tab-btn ${currentTab===o.id?'active':''}" style="${currentTab===o.id?('background:var('+o.accentVar+');color:'+o.onAccent+';'):''}" onclick="selectTab('${o.id}')">${o.nome}</button>
  `).join('');
}

function selectTab(id){
  currentTab = id;
  document.getElementById('tabs').style.display = '';
  document.getElementById('content').classList.remove('painel-mode');
  renderTabs();
  renderForm(oficinaById(id));
}

function optRow(name, label, extra){
  return `<label class="opt-row">
    <input type="radio" name="${name}" value="${escapeAttr(label)}" required onchange="${extra||''}">
    <span>${label}</span>
  </label>`;
}

function escapeAttr(str){ return String(str).replace(/"/g,'&quot;'); }

function onlyDigits(str){
  return String(str||'').split('').filter(function(ch){ return ch >= '0' && ch <= '9'; }).join('');
}

function formatCPF(el){
  const v = onlyDigits(el.value).slice(0,11);
  let out = v;
  if(v.length>9) out = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9,11);
  else if(v.length>6) out = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
  else if(v.length>3) out = v.slice(0,3)+'.'+v.slice(3);
  el.value = out;
}

function formatTelefone(el){
  const v = onlyDigits(el.value).slice(0,11);
  let out = '';
  if(v.length===0) out = '';
  else if(v.length<=2) out = '('+v;
  else if(v.length<=3) out = '('+v.slice(0,2)+') '+v.slice(2);
  else if(v.length<=7) out = '('+v.slice(0,2)+') '+v.slice(2,3)+' '+v.slice(3);
  else out = '('+v.slice(0,2)+') '+v.slice(2,3)+' '+v.slice(3,7)+'-'+v.slice(7);
  el.value = out;
}

function formatCEP(el){
  const v = onlyDigits(el.value).slice(0,8);
  let out = v;
  if(v.length>5) out = v.slice(0,5)+'-'+v.slice(5);
  el.value = out;
}

async function buscarCEP(value){
  const digits = onlyDigits(value);
  const errEl = document.getElementById('err-cep-busca');
  if(!errEl) return;
  errEl.classList.remove('show');
  if(digits.length !== 8) return;
  try{
    const res = await fetch('https://viacep.com.br/ws/'+digits+'/json/');
    const data = await res.json();
    if(data.erro){
      errEl.classList.add('show');
      return;
    }
    const ruaEl = document.getElementById('campo-rua');
    const bairroEl = document.getElementById('campo-bairro');
    if(ruaEl && data.logradouro) ruaEl.value = data.logradouro;
    if(bairroEl && data.bairro) bairroEl.value = data.bairro;
  }catch(e){
    errEl.classList.add('show');
  }
}

function getInscricaoStatus(oficina){
  if(TESTE_IGNORAR_PRAZO) return 'aberto';
  const now = new Date();
  const inicio = new Date(oficina.inscInicioISO);
  const fim = new Date(oficina.inscFimISO);
  if(now < inicio) return 'antes';
  if(now > fim) return 'encerrado';
  return 'aberto';
}

function statusCardHtml(oficina, status){

}

}

  document.getElementById('gate-card').style.display = 'none';
  const form = document.getElementById('insc-form');
  form.style.display = 'block';

function toggleOutro(field){
  const val = document.querySelector('input[name="'+field+'"]:checked')?.value;
  document.getElementById(field+'-outro-block').style.display = (val==='Outra') ? 'block' : 'none';
}

function toggleIniciante(show){
  document.getElementById('iniciante-block').style.display = show ? 'block' : 'none';
}

function handleCondicao(changed){
  const boxes = document.querySelectorAll('input[name="condicao"]');
  if(changed.value==='Não possuo' && changed.checked){
    boxes.forEach(b=>{ if(b.value!=='Não possuo') b.checked=false; });
  } else if(changed.checked){
    const naoPossuo = [...boxes].find(b=>b.value==='Não possuo');
    if(naoPossuo) naoPossuo.checked=false;
  }
  const anyOther = [...boxes].some(b=>b.checked && b.value!=='Não possuo');
  document.getElementById('acompanhante-block').style.display = anyOther ? 'block' : 'none';
  document.getElementById('err-condicao').classList.remove('show');
}

function handleRestricao(changed){
  const boxes = document.querySelectorAll('input[name="restricaoAlimentar"]');
  const naoLabel = 'Não possuo restrições alimentares';
  if(changed.value===naoLabel && changed.checked){
    boxes.forEach(b=>{ if(b.value!==naoLabel) b.checked=false; });
  } else if(changed.checked){
    const nao = [...boxes].find(b=>b.value===naoLabel);
    if(nao) nao.checked=false;
  }
  const outraChecked = [...boxes].some(b=>b.checked && b.value==='Outra');
  document.getElementById('restricao-outro-block').style.display = outraChecked ? 'block' : 'none';
  document.getElementById('err-restricao').classList.remove('show');
}

function toggleRegionalSub(val){
  document.getElementById('regional-sub-block').style.display = (val==='Região metropolitana') ? 'block' : 'none';
}

function computeScore(fd){
  let score = 0;
  const map = (opts,key)=>{ const v=fd.get(key); const found=opts.find(o=>o[0]===v); return found?found[1]:0; };
  score += map(IDADE_OPT,'idade');
  score += map(GENERO_OPT,'genero');
  score += map(ORIENT_OPT,'orientacao');
  score += map(RACA_OPT,'corRaca');
  score += map(MAESOLO_OPT,'maeSolo');
  score += fd.get('artista')==='Sim' ? 1 : 0;
  if(fd.get('artista')==='Sim' && fd.get('iniciante')==='Sim, sou iniciante') score += 1;
  score += fd.get('periferia')==='Sim' ? 1 : 0;
  return score;
}

async function submitForm(oficinaId){
  const form = document.getElementById('insc-form');
  const btn = document.getElementById('submit-btn');
  const fd = new FormData(form);

  const cpfRaw = fd.get('cpf')||'';
  const cpfDigits = cpfRaw.split('').filter(function(ch){ return ch >= '0' && ch <= '9'; }).join('');
  const errCpf = document.getElementById('err-cpf');
  if(cpfDigits.length !== 11){ errCpf.classList.add('show'); errCpf.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  errCpf.classList.remove('show');

  const condicoes = [...document.querySelectorAll('input[name="condicao"]:checked')].map(i=>i.value);
  const errCondicao = document.getElementById('err-condicao');
  if(condicoes.length===0){ errCondicao.classList.add('show'); errCondicao.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  errCondicao.classList.remove('show');

  const restricoes = [...document.querySelectorAll('input[name="restricaoAlimentar"]:checked')].map(i=>i.value);
  const errRestricao = document.getElementById('err-restricao');
  if(restricoes.length===0){ errRestricao.classList.add('show'); errRestricao.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  errRestricao.classList.remove('show');

  if(!checkGateReady()){
    document.getElementById('gate-card').style.display = 'block';
    document.getElementById('err-gate').classList.add('show');
    document.getElementById('gate-card').scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }

  if(!form.reportValidity()){
    const invalid = form.querySelector(':invalid');
    if(invalid) invalid.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const record = {
    oficina_id: oficinaId,
    nome: fd.get('nome')||'',
    cpf: cpfDigits,
    email: fd.get('email')||'',
    telefone: fd.get('telefone')||'',
    cep: fd.get('cep')||'',
    rua: fd.get('rua')||'',
    bairro: fd.get('bairro')||'',
    idade: fd.get('idade')||'',
    genero: fd.get('genero')||'',
    genero_outro: fd.get('generoOutro')||'',
    orientacao: fd.get('orientacao')||'',
    orientacao_outro: fd.get('orientacaoOutro')||'',
    cor_raca: fd.get('corRaca')||'',
    mae_solo: fd.get('maeSolo')||'',
    artista: fd.get('artista')||'',
    iniciante: fd.get('iniciante')||'',
    condicao: condicoes,
    acompanhante: fd.get('acompanhante')||'',
    restricao_alimentar: restricoes,
    restricao_alimentar_outro: fd.get('restricaoAlimentarOutro')||'',
    periferia: fd.get('periferia')||'',
    regional: fd.get('regional')||'',
    regional_sub: fd.get('regionalSub')||'',
    aceite_compromisso: true,
    aceite_imagem: true,
    total_score: computeScore(fd),
    contatado: false
  };

  try{
    const { error } = await sb.from('inscricoes').insert([record]);
    if(error){
      btn.disabled=false; btn.textContent='Enviar inscrição';
      alert('Não foi possível enviar. Tente novamente. ('+error.message+')');
      return;
    }
    renderSuccess(oficinaId);
  }catch(e){
    btn.disabled=false; btn.textContent='Enviar inscrição';
    alert('Não foi possível enviar. Tente novamente.');
  }
}

function renderSuccess(oficinaId){
  const oficina = oficinaById(oficinaId);
  document.getElementById('content').innerHTML = `
    <div class="card success-card">
      <div class="swatch-band" style="background:var(${oficina.accentVar});max-width:60px;margin:0 auto;"></div>
      <h3>Inscrição enviada</h3>
      <p>Sua inscrição para <strong>${oficina.nome}</strong> foi registrada. Toda a comunicação sobre a seleção será feita pelo e-mail informado — fique de olho na caixa de entrada e no spam.</p>
      <button onclick="selectTab('${oficinaId}')">Fazer outra inscrição</button>
    </div>
  `;
}

async function renderPainel(){
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('content').classList.add('painel-mode');
  const c = document.getElementById('content');
  if(!painelUnlocked){
    c.innerHTML = `
      <div class="card lock-card">
        <h3 style="font-weight:700;font-size:20px;margin:0;">Painel da equipe</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin-top:.5rem;line-height:1.6;">Área interna com a listagem de inscrições por oficina, ordenada por pontuação. Entre com o login da equipe.</p>
        <div class="login-field">
          <label for="admin-email">E-mail</label>
          <input type="email" id="admin-email" autocomplete="username">
        </div>
        <div class="login-field">
          <label for="admin-password">Senha</label>
          <div class="password-wrap">
            <input type="password" id="admin-password" autocomplete="current-password">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility()" aria-label="Mostrar senha">Mostrar</button>
          </div>
        </div>
        <div class="field-error show" id="admin-login-error" style="display:none;"></div>
        <button id="admin-login-btn" onclick="tryUnlock()">Entrar</button>
        <p style="font-size:11.5px;color:var(--ink-soft);margin-top:1rem;">Acesso restrito à equipe do projeto — fale com quem administra o Supabase para receber um login.</p>
      </div>
    `;
    return;
  }
  renderPainelContent();
}

function togglePasswordVisibility(){
  const input = document.getElementById('admin-password');
  const btn = document.querySelector('.pw-toggle');
  if(input.type==='password'){ input.type='text'; btn.textContent='Ocultar'; }
  else{ input.type='password'; btn.textContent='Mostrar'; }
}

async function tryUnlock(){
  const email = document.getElementById('admin-email').value;
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('admin-login-error');
  const btn = document.getElementById('admin-login-btn');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    errEl.textContent = 'Login ou senha incorretos.';
    errEl.classList.add('show'); errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  painelUnlocked = true;
  renderPainelContent();
}

async function logoutPainel(){
  await sb.auth.signOut();
  painelUnlocked = false;
  renderPainel();
}

async function renderPainelContent(){
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="painel-header"><h2>Painel da equipe</h2><button class="toggle-btn" onclick="logoutPainel()">Sair</button></div>
    <div class="painel-toolbar" id="painel-toolbar"></div>
    <div id="painel-body"><p class="empty-note">Carregando inscrições...</p></div>
  `;
  document.getElementById('painel-toolbar').innerHTML = OFICINAS.map(o=>`
    <button class="${painelOficina===o.id?'active':''}" onclick="switchPainelOficina('${o.id}')">${o.nome}</button>
  `).join('') + `<button onclick="exportCSV()" style="margin-left:auto;">Exportar CSV</button>`;

  const subs = await loadSubmissions(painelOficina);
  renderPainelTable(subs);
}

function switchPainelOficina(id){ painelOficina = id; renderPainelContent(); }

async function loadSubmissions(oficinaId){
  try{
    const { data, error } = await sb.from('inscricoes')
      .select('*')
      .eq('oficina_id', oficinaId)
      .order('total_score', { ascending:false });
    if(error){ console.error(error); return []; }
    return data || [];
  }catch(e){ return []; }
}

function priorityChips(r){
  const chips = [];
  if(r.mae_solo && r.mae_solo.indexOf('Sim')===0) chips.push('mãe solo');
  if(['Preta','Parda','Indígena'].indexOf(r.cor_raca)>-1) chips.push(r.cor_raca);
  if(['Homem trans','Mulher trans','Travesti','Não-binário'].indexOf(r.genero)>-1 ||
     (r.orientacao && ['Heterossexual','Prefiro não responder'].indexOf(r.orientacao)===-1)) chips.push('LGBTQIA+');
  if(r.idade==='65 anos ou mais') chips.push('pessoa idosa');
  if(r.artista==='Sim' && r.iniciante==='Sim, sou iniciante') chips.push('artista iniciante');
  if(r.periferia==='Sim') chips.push('região periférica');
  return chips;
}

function formatDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}

function renderRow(r, rank){
  const inVaga = rank < VAGAS_LIMITE;
  const rowClass = (r.contatado ? 'contatado ' : '') + (inVaga ? 'in-vaga' : 'fora-vaga');
  return `
    <tr class="${rowClass}">
      <td><span class="score-badge">${r.total_score}</span></td>
      <td>${escapeHtml(r.nome)}<br><span style="color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;">${escapeHtml(r.idade||'')}</span></td>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;">${escapeHtml(r.telefone)}<br>${escapeHtml(r.email)}</td>
      <td><div class="chip-row">${priorityChips(r).map(ch=>'<span class="mini-chip">'+ch+'</span>').join('') || '—'}</div></td>
      <td>${r.periferia==='Sim'?'Periférica':'—'}<br><span style="color:var(--ink-soft);">${escapeHtml(r.regional||'')}</span></td>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;">${formatDate(r.created_at)}</td>
      <td style="text-align:center;">
        <input type="checkbox" ${r.contatado?'checked':''} onchange="toggleContatado('${r.id}', this.checked)" style="width:17px;height:17px;accent-color:var(--blue);">
      </td>
      <td style="text-align:center;"><button class="detail-btn" onclick="showDetalhe('${r.id}')">Ver</button></td>
    </tr>
  `;
}

const FIELD_LABELS = {
  nome:'Nome', cpf:'CPF', email:'Email', telefone:'Telefone',
  cep:'CEP', rua:'Rua', bairro:'Bairro',
  idade:'Idade', genero:'Identidade de gênero', genero_outro:'Gênero (outra)',
  orientacao:'Orientação sexual', orientacao_outro:'Orientação (outra)',
  cor_raca:'Cor/raça', mae_solo:'Mãe solo', artista:'É artista?', iniciante:'Iniciante?',
  condicao:'Condição/deficiência', acompanhante:'Precisa de acompanhante?',
  restricao_alimentar:'Restrição alimentar', restricao_alimentar_outro:'Restrição (outra)',
  periferia:'Região periférica?', regional:'Regional', regional_sub:'Cidade (região metropolitana)',
  aceite_compromisso:'Aceitou termo de compromisso',
  aceite_imagem:'Autorizou uso de imagem', total_score:'Score total', contatado:'Já comunicado',
  created_at:'Data de envio'
};

function formatFieldValue(key, val){
  if(val==null || val==='') return '—';
  if(Array.isArray(val)) return val.length ? val.join(', ') : '—';
  if(typeof val === 'boolean') return val ? 'Sim' : 'Não';
  if(key==='created_at') return formatDate(val);
  return String(val);
}

function showDetalhe(id){
  const r = currentSubs.find(x=>String(x.id)===String(id));
  if(!r) return;
  const oficina = oficinaById(painelOficina);
  const order = ['total_score','contatado','nome','cpf','email','telefone','cep','rua','bairro','idade',
    'genero','genero_outro','orientacao','orientacao_outro','cor_raca','mae_solo','artista','iniciante',
    'condicao','acompanhante','restricao_alimentar','restricao_alimentar_outro','periferia','regional',
    'regional_sub','aceite_compromisso','aceite_imagem','created_at'];
  const rowsHtml = order.map(key=>`
    <tr><th>${FIELD_LABELS[key]||key}</th><td>${escapeHtml(formatFieldValue(key, r[key]))}</td></tr>
  `).join('');
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeDetalhe()">
      <div class="modal-box">
        <div class="modal-header">
          <h3>${escapeHtml(r.nome)} — ${oficina.nome}</h3>
          <button class="toggle-btn" onclick="closeDetalhe()">Fechar</button>
        </div>
        <div class="modal-table-wrap">
          <table class="detail-table"><tbody>${rowsHtml}</tbody></table>
        </div>
      </div>
    </div>
  `;
}

function closeDetalhe(){
  document.getElementById('modal-root').innerHTML = '';
}

function renderPainelTable(subs){
  currentSubs = subs;
  const body = document.getElementById('painel-body');
  const oficina = oficinaById(painelOficina);
  if(subs.length===0){
    body.innerHTML = '<p class="empty-note">Nenhuma inscrição registrada ainda para '+oficina.nome+'.</p>';
    return;
  }
  const avg = (subs.reduce((s,r)=>s+(r.total_score||0),0)/subs.length).toFixed(1);
  const dentroVaga = Math.min(subs.length, VAGAS_LIMITE);

  const pendentes = subs.filter(r=>!r.contatado);
  const contatados = subs.filter(r=>r.contatado);

  const headerRow = '<tr><th>Score</th><th>Nome</th><th>Contato</th><th>Perfil</th><th>Regional</th><th>Data</th><th>Contatado</th><th>Detalhes</th></tr>';

  body.innerHTML = `
    <div class="stats-row">
      <div class="stat-box"><span>Inscrições</span><strong>${subs.length}</strong></div>
      <div class="stat-box"><span>Score médio</span><strong>${avg}</strong></div>
      <div class="stat-box"><span>Dentro das ${VAGAS_LIMITE} vagas</span><strong>${dentroVaga}</strong></div>
    </div>
    <div class="legend-row">
      <span><span class="legend-dot" style="background:#C3D62E"></span>dentro das ${VAGAS_LIMITE} vagas (pelo score)</span>
      <span><span class="legend-dot" style="background:#F0C23E"></span>lista de espera</span>
    </div>
    <button class="section-toggle" onclick="switchContatadosView(false)" ${!showContatados?'style="outline:2px solid var(--blue);"':''}>
      Fila de contato (${pendentes.length})
    </button>
    ${!showContatados ? `
      <div class="table-wrap">
        <table><thead>${headerRow}</thead><tbody>
          ${pendentes.map((r)=>renderRow(r, subs.indexOf(r))).join('')}
        </tbody></table>
      </div>
    ` : ''}
    <button class="section-toggle" onclick="switchContatadosView(true)" ${showContatados?'style="outline:2px solid var(--blue);"':''}>
      Já comunicados (${contatados.length})
    </button>
    ${showContatados ? `
      <div class="table-wrap">
        <table><thead>${headerRow}</thead><tbody>
          ${contatados.map((r)=>renderRow(r, subs.indexOf(r))).join('')}
        </tbody></table>
      </div>
    ` : ''}
  `;
}

function switchContatadosView(val){ showContatados = val; renderPainelContent(); }

async function toggleContatado(id, checked){
  try{
    const { error } = await sb.from('inscricoes').update({ contatado: checked }).eq('id', id);
    if(error){ alert('Não foi possível atualizar. ('+error.message+')'); return; }
    renderPainelContent();
  }catch(e){}
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str==null?'':String(str);
  return d.innerHTML;
}

async function exportCSV(){
  const subs = await loadSubmissions(painelOficina);
  if(subs.length===0){ alert('Nenhuma inscrição para exportar.'); return; }
  const cols = ['total_score','contatado','nome','cpf','email','telefone','cep','rua','bairro','idade','genero','genero_outro','orientacao','orientacao_outro','cor_raca','mae_solo','artista','iniciante','condicao','acompanhante','restricao_alimentar','restricao_alimentar_outro','periferia','regional','regional_sub','aceite_compromisso','aceite_imagem','created_at'];
  const rows = [cols.join(',')];
  subs.forEach(r=>{
    rows.push(cols.map(c=>{
      let v = r[c];
      if(Array.isArray(v)) v = v.join(' | ');
      v = (v==null?'':String(v)).replace(/"/g,'""');
      return '"'+v+'"';
    }).join(','));
  });
  const blob = new Blob([rows.join(String.fromCharCode(10))], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inscricoes_'+painelOficina+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

window.addEventListener('hashchange', function(){
  if(isPainelRoute()){ renderPainel(); }
});

if(isPainelRoute()){
  renderPainel();
}else{
  renderTabs();
  renderForm(oficinaById(currentTab));
}
</script>
</body>
</html>
